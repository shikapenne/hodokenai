name: Steam (PC) build

# Makes the PC version for Windows, Mac and Linux (Steam Deck) on every push to main,
# or by hand from the Actions tab. Download the zips from the run's "Artifacts".
# Each zip is the folder you upload to Steam with SteamCMD (the .exe / .app / binary is inside).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: mac
          - os: ubuntu-latest
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        shell: bash
        run: |
          npm ci
          pip install fonttools brotli
          cd desktop && npm ci

      - name: Build the game for PC and wrap it in Electron
        shell: bash
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"  # no code signing for now
        run: npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: hodokenai-steam-${{ matrix.name }}
          path: |
            desktop/dist/*-unpacked/
            desktop/dist/mac*/
