name: Keep ranking server awake

# Supabase pauses free projects that see too little database traffic in a week.
# This reads the leaderboard once a day so the ranking never goes to sleep.
# (It only reads; it never writes anything.)
on:
  schedule:
    - cron: "17 3 * * *"   # every day at 12:17 Japan time
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read a few leaderboard rows
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" \
              "https://xzimzkbrhgymavvkzaik.supabase.co/rest/v1/scores?select=level,ms&order=ms.asc&limit=3&level=eq.L$i" \
              -H "apikey: sb_publishable_l6KHmDsxXfVq7xiZHo5qCw_QfoJOj91")
            echo "L$i -> HTTP $code"
            sleep 5
          done
