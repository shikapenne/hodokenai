name: iOS release (TestFlight)

# Builds the iPhone app on GitHub's Mac, signs it with your App Store Connect API key
# and uploads it to App Store Connect, where it shows up in TestFlight after processing.
# Run it from the Actions tab ("Run workflow").
#
# Needs these repository secrets:
#   APPLE_TEAM_ID   – Team ID (developer.apple.com > Membership details)
#   ASC_ISSUER_ID   – Issuer ID   (App Store Connect > Users and Access > Integrations)
#   ASC_KEY_ID      – Key ID of the team API key (role: Admin)
#   ASC_KEY_P8      – contents of the AuthKey_XXXX.p8 file
# The app must already exist in App Store Connect with bundle ID jp.shikapenne.hodokenai.
on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the game and copy it into the iOS project
        run: |
          npm ci
          pip install fonttools brotli
          npm run build:web
          npx cap sync ios
      - name: API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          printf '%s\n' "$ASC_KEY_P8" > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
      - name: Version from the Android build (same version on both stores)
        run: |
          echo "VERSION=$(sed -n 's/.*versionName \"\(.*\)\"/\1/p' android/app/build.gradle | head -1)" >> $GITHUB_ENV
          echo "BUILD=$GITHUB_RUN_NUMBER" >> $GITHUB_ENV
      - name: Archive (unsigned; the App Store signature is added in the next step)
        # Signing here would need a development profile, which needs a registered iPhone.
        # The export step signs for distribution in the cloud with the API key instead.
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath $RUNNER_TEMP/App.xcarchive \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" \
            archive
      - name: Upload to App Store Connect
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist -exportPath $RUNNER_TEMP/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER"
          echo "Uploaded version $VERSION ($BUILD). It appears in TestFlight after Apple finishes processing (about 10-30 minutes)."
