<title>ほどけない</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: one-screen game. Velvet jewelry tray fills the screen, HUD floats top, controls bottom. Single dark look by design. */
:root {
  --velvet: #17122a;
  --velvet-hi: #2b2148;
  --brass: #d1ab55;
  --ivory: #f1e8d8;
  --muted: #a397bd;
  --danger: #ec5f4f;
  --panel: rgba(18, 13, 33, 0.9);
  --line: rgba(209, 171, 85, 0.28);
  --f-display: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --f-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--velvet); color: var(--ivory); font-family: var(--f-body);
  overflow: hidden; overscroll-behavior: none; -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#app { position: relative; height: calc(100% - var(--ad-h, 0px)); }
/* the banner (drawn natively by the app) sits in the space below #app */
.ad-gap { position: fixed; left: 0; right: 0; bottom: 0; height: var(--ad-h, 0px); background: #0b0812; pointer-events: none; }
[hidden] { display: none !important; }
#c { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }

.topbar { position: absolute; left: 0; right: 0; top: 0; z-index: 2; display: flex; flex-direction: column; pointer-events: none; }
.hud {
  pointer-events: none; padding-bottom: 6px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.lvl-wrap { display: flex; align-items: center; gap: 10px; min-width: 0; }
.snd { pointer-events: auto; font-size: 11px; letter-spacing: 0.06em; color: var(--muted); border: 1px solid var(--line); background: rgba(23,18,42,0.75); border-radius: 999px; padding: 4px 10px; white-space: nowrap; }
.pausebtn { pointer-events: auto; flex-shrink: 0; width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: rgba(23,18,42,0.8); display: inline-flex; align-items: center; justify-content: center; gap: 5px; padding: 0; }
.pausebtn span { width: 4px; height: 14px; border-radius: 2px; background: var(--ivory); }
.pausebtn:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
.pause-card { justify-items: center; text-align: center; width: min(320px, 100%); }
.pause-list { display: grid; gap: 10px; width: 100%; }
.pause-list .btn { padding: 13px 18px; font-size: 15px; }
.snd:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
.lvl { font-family: var(--f-display); font-weight: 800; font-size: 17px; letter-spacing: 0.04em; min-width: 0; flex-shrink: 0; max-width: 8em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lvl small { display: block; font-family: var(--f-body); font-weight: 500; font-size: 11px; color: var(--muted); letter-spacing: 0.08em; }
.stats { display: flex; gap: 14px; font-variant-numeric: tabular-nums; flex-shrink: 0; }
.stat { text-align: right; }
.stat b { display: block; font-size: 18px; font-weight: 700; line-height: 1.1; }
.stat span { font-size: 10px; color: var(--muted); letter-spacing: 0.12em; }
.stat.zero b { color: var(--brass); }


.bar {
  pointer-events: auto;
  display: flex; justify-content: space-between; gap: 8px;
  padding-top: 0; padding-bottom: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button { font: inherit; color: inherit; cursor: pointer; }
.btn {
  border: 1px solid var(--line); background: rgba(23,18,42,0.75); border-radius: 999px;
  padding: 9px 18px; font-size: 14px; font-weight: 500; letter-spacing: 0.05em;
}
.btn:hover { border-color: var(--brass); }
.bar .btn { flex: 1; padding: 8px 6px; font-size: 13px; white-space: nowrap; }
.btn:focus-visible, .lv:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
.btn.primary { background: var(--brass); color: #1a1326; border-color: var(--brass); font-weight: 700; }

.overlay {
  position: absolute; inset: 0; z-index: 5; display: grid; place-items: center;
  background: rgba(12, 9, 22, 0.72); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
  padding-block: 20px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow-y: auto;
}
.card { width: min(400px, 100%); display: grid; gap: 16px; }
#menu .card { gap: 12px; }
#menu .levels { gap: 6px; }
/* short screens (small phones with the ad banner): drop the lead so the title screen never scrolls */
@media (max-height: 660px) { #menu .lead { display: none; } #menu .card { gap: 10px; } .lv .ds { font-size: 11px; line-height: 1.35; } }
@media (max-height: 540px) { .lv .ds { display: none; } #menu .subtitle { display: none; } }
.title { font-family: var(--f-display); font-weight: 800; font-size: clamp(32px, 10vw, 52px); letter-spacing: 0.06em; line-height: 1; white-space: nowrap; }
.lead { font-size: 13px; line-height: 1.7; color: var(--ivory); opacity: .9; }
.rules { display: grid; gap: 10px; font-size: 14px; line-height: 1.7; color: var(--muted); }
.rules b { color: var(--ivory); font-weight: 500; }
.levels { display: grid; gap: 8px; }
.lv {
  display: grid; grid-template-columns: 36px 1fr auto; align-items: center; gap: 12px; text-align: left;
  border: 1px solid var(--line); border-radius: 10px; background: rgba(43,33,72,0.55); padding: 8px 12px;
}
.lv:hover { border-color: var(--brass); }
.lv:disabled { opacity: 0.45; cursor: default; }
.lv:disabled:hover { border-color: var(--line); }
.lv.locked .bt { font-size: 11px; }
.lv .no { font-family: var(--f-display); font-size: 22px; font-weight: 800; color: var(--brass); }
.lv .nm { font-weight: 700; font-size: 15px; }
.lv .ds { font-size: 11.5px; color: var(--muted); }
.lv .bt { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
.lv .bt.done { color: var(--brass); }
.big { font-family: var(--f-display); font-weight: 800; font-size: 44px; letter-spacing: 0.08em; }
.res { font-size: 14px; color: var(--muted); line-height: 1.8; font-variant-numeric: tabular-nums; }
.res b { color: var(--ivory); font-size: 22px; font-weight: 700; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.menu-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.subtitle { font-size: 12px; letter-spacing: 0.12em; color: var(--brass); margin-top: -8px; }
.lang-pick { display: grid; gap: 3px; font-size: 10px; letter-spacing: 0.1em; color: var(--muted); flex-shrink: 0; margin-top: 6px; }
.lang-pick select { font: inherit; font-size: 13px; letter-spacing: 0; color: var(--ivory); background: rgba(23,18,42,0.85); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; }
.lang-pick select:focus-visible { outline: 2px solid var(--brass); outline-offset: 1px; }
/* Chinese and Korean use the phone's own fonts: the bundled Japanese faces don't cover them */
:root[lang|="zh"] { --f-display: "Songti SC", "Noto Serif CJK SC", "Noto Serif SC", serif; --f-body: "PingFang SC", "PingFang TC", "Noto Sans CJK SC", "Microsoft YaHei", system-ui, sans-serif; }
:root[lang="ko"] { --f-display: "AppleMyungjo", "Noto Serif KR", "Noto Serif CJK KR", serif; --f-body: "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif; }
.rank-box { display: grid; gap: 10px; border-top: 1px solid var(--line); padding-top: 12px; }
.name-row { display: grid; gap: 6px; font-size: 12.5px; color: var(--muted); }
.name-input { display: flex; gap: 8px; }
.name-input input { flex: 1; min-width: 0; font: inherit; font-size: 16px; color: var(--ivory); background: rgba(255,255,255,0.06); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; }
.name-input input:focus-visible { outline: 2px solid var(--brass); outline-offset: 1px; }
.rank-line { font-size: 14px; color: var(--muted); line-height: 1.7; font-variant-numeric: tabular-nums; }
.rank-line b { color: var(--brass); font-size: 20px; }
.btn.x { background: #0d0b12; border-color: rgba(241,232,216,0.35); }
.board-card { width: min(420px, 100%); }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tabs button { font: inherit; font-size: 13px; color: var(--muted); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; }
.tabs button[aria-selected="true"] { color: #1a1326; background: var(--brass); border-color: var(--brass); font-weight: 700; }
.board-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; max-height: 52vh; overflow-y: auto; font-variant-numeric: tabular-nums; }
.board-list li { display: grid; grid-template-columns: 2.4em 1fr auto; gap: 10px; padding: 7px 10px; border-radius: 8px; background: rgba(255,255,255,0.03); font-size: 14px; }
.board-list li.me { background: rgba(209,171,85,0.18); }
.board-list .pos { color: var(--brass); font-weight: 700; text-align: right; }
.board-list .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.board-list .empty { display: block; color: var(--muted); background: none; }
.toast { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 3; font-size: 13px; color: var(--muted); pointer-events: none; transition: opacity .6s; white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>

<div class="ad-gap" aria-hidden="true"></div>
<div id="app">
  <canvas id="c" data-i18n-aria="tray" aria-label="絡まったネックレスのトレイ"></canvas>
  <div class="topbar">
    <div class="hud">
      <div class="lvl-wrap"><button class="pausebtn" id="pauseBtn" type="button" data-i18n-aria="pause" aria-label="ポーズ"><span></span><span></span></button><div class="lvl" id="lvlName">ほどけない<small>LEVEL 1</small></div><button class="snd" id="viewBtn" type="button" data-i18n="view">視点を戻す</button></div>
      <div class="stats">
        <div class="stat" id="crossBox"><b id="cross">–</b><span data-i18n="cross">交差</span></div>
        <div class="stat"><b id="time">0:00.0</b><span data-i18n="time">時間</span></div>
      </div>
    </div>
  </div>
  <div class="toast" id="toast">鎖をつまんで引いてみてください</div>

  <div class="overlay" id="menu">
    <div class="card">
      <div class="menu-top"><div class="title">ほどけない</div><label class="lang-pick"><span data-i18n="lang">言語</span><select id="langSel"></select></label></div>
      <div class="subtitle" data-i18n="sub">絡まったネックレスをほどくパズル</div>
      <p class="lead" data-i18n="lead">引き出しの奥で絡まったネックレスを、ほどくゲームです。結び目は、焦って引くほど固く締まります。</p>
      <div class="levels" id="levels"></div>
      <button class="btn" id="boardBtn" type="button" hidden data-i18n="board">ランキングを見る</button>
    </div>
  </div>

  <div class="overlay" id="howto" hidden>
    <div class="card">
      <div class="big" data-i18n="howTo">遊び方</div>
      <div class="rules" id="rules"></div>
      <button class="btn primary" id="howtoClose" type="button" data-i18n="startPlay">はじめる</button>
    </div>
  </div>

  <div class="overlay" id="pause" hidden>
    <div class="card pause-card">
      <div class="big" data-i18n="pause">ポーズ</div>
      <div class="pause-list">
        <button class="btn primary" id="resumeBtn" type="button" data-i18n="resume">つづける</button>
        <button class="btn" id="soundBtn" type="button" aria-pressed="true">音 オン</button>
        <button class="btn" id="howtoBtn" type="button" data-i18n="howTo">遊び方</button>
        <button class="btn" id="retryBtn" type="button" data-i18n="retry">最初から</button>
        <button class="btn" id="menuBtn" type="button" data-i18n="levels">レベル選択</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="board" hidden>
    <div class="card board-card">
      <div class="big" data-i18n="ranking">ランキング</div>
      <div class="tabs" id="boardTabs" role="tablist"></div>
      <ol class="board-list" id="boardList"></ol>
      <button class="btn" id="boardClose" type="button" data-i18n="close">閉じる</button>
    </div>
  </div>

  <div class="overlay" id="win" hidden>
    <div class="card">
      <div class="big" data-i18n="cleared">ほどけた</div>
      <div class="res" id="winRes"></div>
      <div class="rank-box" id="rankBox" hidden>
        <form class="name-row" id="nameForm" hidden>
          <label for="nameInput" data-i18n="nameLabel">ランキングに載せる名前</label>
          <div class="name-input"><input id="nameInput" maxlength="12" autocomplete="nickname" placeholder="12文字まで" data-i18n-ph="namePh"><button class="btn primary" type="submit" data-i18n="register">登録</button></div>
        </form>
        <div class="rank-line" id="rankLine"></div>
      </div>
      <div class="row">
        <button class="btn primary" id="nextBtn" type="button" data-i18n="next">次のレベル</button>
        <button class="btn" id="winMenu" type="button" data-i18n="levels">レベル選択</button>
        <button class="btn x" id="shareBtn" type="button" data-i18n="post">Xにポスト</button>
      </div>
    </div>
  </div>

</div>
